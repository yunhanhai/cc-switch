name: "🐛 Bug Report / Bug 报告"
description: |
  Report errors or unexpected behavior.
  报告错误或异常行为。
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This edition is independently maintained by yunhanhai. Redact API keys, tokens and personal data from all attachments.
        本版本由 yunhanhai 独立维护，附件请隐藏 API Key、令牌和个人信息。

  - type: checkboxes
    attributes:
      label: Self Checks / 自检
      options:
        - label: |
            I have read this edition's [README](https://github.com/yunhanhai/yunswitch#readme).
            我已阅读本版本的 [README](https://github.com/yunhanhai/yunswitch#readme)。
          required: true
        - label: |
            I have searched for [existing issues](https://github.com/yunhanhai/yunswitch/issues), including closed ones.
            我已搜索过[已有的 Issue](https://github.com/yunhanhai/yunswitch/issues)，包括已关闭的。
          required: true

  - type: input
    attributes:
      label: CC Switch Version / 版本号
      description: |
        See the app settings; also include the commit or download source when available.
        查看应用设置页面中的版本号，并尽可能注明提交或下载来源。
      placeholder: "e.g. 3.20.1 + commit hash"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Operating System / 操作系统
      multiple: false
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Related App / 涉及应用
      description: |
        Which app is affected?
        涉及哪个应用？
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - OpenCode
        - OpenClaw
        - Other / 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce / 重现步骤
      description: |
        Please describe the steps to reproduce the bug. Screenshots and logs are helpful.
        请描述重现步骤。截图和日志会很有帮助。
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior / 期望行为
      description: |
        What did you expect to happen?
        你期望发生什么？
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual Behavior / 实际行为
      description: |
        What actually happened?
        实际发生了什么？
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context / 补充信息
      description: |
        Any other information, screenshots, or logs.
        其他信息、截图或日志。
    validations:
      required: false
