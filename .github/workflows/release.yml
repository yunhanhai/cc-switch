# Manually build a draft prerelease. Default scope is Windows x64 only.
# Publish the draft only after the built packages pass installation acceptance.
# Default: manual-install prereleases with no updater signing or Apple notarization.
# Opt in with YUNSWITCH_SIGNED_UPDATER_ENABLED / YUNSWITCH_UPDATER_PUBLIC_KEY
# and TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets.
# Apple signing uses YUNSWITCH_MACOS_NOTARIZATION_ENABLED plus APPLE_* and
# KEYCHAIN_PASSWORD secrets. These credentials must belong to this project.
name: YunSwitch prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing YunSwitch tag to build (e.g. v3.20.1-yunswitch.8)"
        required: false
        type: string
      source_ref:
        description: "Branch or commit for build-only acceptance; leave empty to build a tagged draft release"
        required: false
        type: string
      recheck_run_id:
        description: "Existing Windows package build run to recheck without rebuilding"
        required: false
        type: string
      package_source_sha:
        description: "Exact source SHA of packages when recheck_run_id is set"
        required: false
        type: string
      previous_tag:
        description: "Previous public release to test upgrading; defaults to v3.20.1-yunswitch.7"
        required: false
        type: string
        default: v3.20.1-yunswitch.7
      scope:
        description: "Packages to build; all platforms require separate installation acceptance"
        required: true
        default: windows-x64
        type: choice
        options:
          - windows-x64
          - all

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.source_ref || inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  RUST_MIN_STACK: "33554432"
  CARGO_BUILD_JOBS: "1"
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_SCOPE: ${{ inputs.scope }}
  BUILD_ONLY: ${{ inputs.source_ref != '' }}
  SIGNED_UPDATER_ENABLED: ${{ vars.YUNSWITCH_SIGNED_UPDATER_ENABLED == 'true' }}
  MACOS_NOTARIZATION_ENABLED: ${{ vars.YUNSWITCH_MACOS_NOTARIZATION_ENABLED == 'true' }}

jobs:
  recheck:
    if: inputs.recheck_run_id != ''
    uses: ./.github/workflows/windows-package-recheck.yml
    with:
      build_run_id: ${{ inputs.recheck_run_id }}
      package_source_sha: ${{ inputs.package_source_sha }}
      source_ref: ${{ inputs.source_ref || github.sha }}
      previous_tag: ${{ inputs.previous_tag }}
  release:
    if: inputs.recheck_run_id == ''
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.scope == 'all' && '[{"os":"windows-2022"},{"os":"windows-11-arm","arch":"arm64"},{"os":"ubuntu-22.04"},{"os":"ubuntu-22.04-arm","arch":"arm64"},{"os":"macos-14"}]' || '[{"os":"windows-2022"}]') }}

    steps:
      - name: Validate selected release scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_SCOPE" != 'windows-x64' ] && [ "$RELEASE_SCOPE" != 'all' ]; then
            echo "::error::Select windows-x64 or all explicitly."
            exit 1
          fi
          if [ "$SIGNED_UPDATER_ENABLED" = 'true' ] && [ "$RELEASE_SCOPE" != 'all' ]; then
            echo "::error::Signed updater releases require all six platform targets."
            exit 1
          fi
          if [ "$BUILD_ONLY" != 'true' ] && [ -z "$RELEASE_TAG" ]; then
            echo "::error::Provide an existing tag, or a source_ref for build-only acceptance."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || format('refs/tags/{0}', inputs.tag) }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Verify Node.js and pnpm versions
        run: |
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Cache compiled release dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          save-if: true

      - name: Validate release version and prepare build configuration
        shell: bash
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.YUNSWITCH_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ "$BUILD_ONLY" != 'true' ]; then
            git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
              echo "::error::The release ref must be an existing tag."
              exit 1
            }
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.BUILD_ONLY === 'true' ? `v${pkg.version}` : process.env.RELEASE_TAG;
          if (process.env.BUILD_ONLY === 'true' && process.env.RELEASE_TAG && process.env.RELEASE_TAG !== tag) {
            throw new Error('Optional tag must match the build-only source version');
          }
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=${tag}\n`);
          if (!/^v\d+\.\d+\.\d+-yunswitch\.\d+$/.test(tag)) {
            throw new Error('Use an independent YunSwitch prerelease tag, such as v3.20.1-yunswitch.1');
          }
          const version = tag.slice(1);
          const tauri = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if ([pkg.version, tauri.version, cargo].some(value => value !== version)) {
            throw new Error('Release tag must match package.json, Cargo.toml and tauri.conf.json versions');
          }
          const lock = readFileSync('src-tauri/Cargo.lock', 'utf8').match(/\[\[package\]\]\r?\nname = "cc-switch"\r?\nversion = "([^"]+)"/)?.[1];
          const parts = version.match(/^(\d+\.\d+\.\d+)-yunswitch\.(\d+)$/);
          if (lock !== version || tauri.bundle.windows.wix.version !== `${parts[1]}.${parts[2]}`) {
            throw new Error('Cargo.lock and MSI versions must match the prerelease version');
          }
          const signedUpdater = process.env.SIGNED_UPDATER_ENABLED === 'true';
          if (signedUpdater && !process.env.UPDATER_PUBLIC_KEY?.trim()) {
            throw new Error('Signed updater requires the YunSwitch-owned YUNSWITCH_UPDATER_PUBLIC_KEY variable');
          }
          const config = { bundle: { createUpdaterArtifacts: signedUpdater } };
          if (signedUpdater) {
            config.plugins = { updater: { pubkey: process.env.UPDATER_PUBLIC_KEY } };
          }
          if (process.env.MACOS_NOTARIZATION_ENABLED !== 'true') {
            config.bundle.macOS = { signingIdentity: '-' };
          }
          const path = join(process.env.RUNNER_TEMP, 'yunswitch-release-config.json');
          writeFileSync(path, JSON.stringify(config));
          appendFileSync(process.env.GITHUB_ENV, `TAURI_RELEASE_CONFIG=${path}\n`);
          NODE
          echo "Updater signing enabled: $SIGNED_UPDATER_ENABLED"
          echo "Apple Developer ID signing and notarization enabled: $MACOS_NOTARIZATION_ENABLED"

      - name: Prepare Tauri signing key
        if: env.SIGNED_UPDATER_ENABLED == 'true'
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RAW_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY Secret 为空或不存在" >&2
            echo "请检查 GitHub 仓库 Settings > Secrets and variables > Actions" >&2
            exit 1
          fi

          RAW="$RAW_KEY"
          # 目标：提供正确的私钥“文件路径”给 Tauri CLI，避免内容解码歧义
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          # 情况 1：原始两行文本（第一行以 "untrusted comment:" 开头）
          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
            echo "✅ 使用原始两行密钥文件格式"
          else
            # 情况 2：整体被 base64 包裹（解包后应当是两行）
            if DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
               && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
              printf '%s\n' "$DECODED" > "$KEY_PATH"
              echo "✅ 成功解码 base64 包裹密钥，已还原为两行文件"
            else
              # 情况 3：已是第二行（纯 Base64 一行）→ 构造两行文件
              if echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
                ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
                printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
                echo "✅ 使用一行 Base64 私钥，已构造两行文件"
              else
                echo "❌ TAURI_SIGNING_PRIVATE_KEY 格式无法识别：既不是两行原文，也不是其 base64，亦非一行 base64" >&2
                exit 1
              fi
            fi
          fi
          # 将“完整两行内容”作为环境变量注入（Tauri 支持传入完整私钥文本或文件路径）
          # 使用多行写入语法，保持换行以便解析
          # 将完整两行私钥内容进行 base64 编码，作为单行内容注入环境变量
          if command -v base64 >/dev/null 2>&1; then
            KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          elif command -v openssl >/dev/null 2>&1; then
            KEY_B64=$(openssl base64 -A -in "$KEY_PATH")
          else
            KEY_B64=$(KEY_PATH="$KEY_PATH" node -e "process.stdout.write(require('fs').readFileSync(process.env.KEY_PATH).toString('base64'))")
          fi
          if [ -z "$KEY_B64" ]; then
            echo "❌ 无法生成私钥 base64 内容" >&2
            exit 1
          fi
          echo "::add-mask::$KEY_B64"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const delimiter = randomUUID();
          appendFileSync(process.env.GITHUB_ENV,
            `TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<${delimiter}\n${process.env.KEY_PASSWORD ?? ''}\n${delimiter}\n`);
          NODE
          echo "✅ Tauri signing key prepared"

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.MACOS_NOTARIZATION_ENABLED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for required in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is required when Apple signing and notarization are enabled."
              exit 1
            fi
          done
          # Decode .p12 certificate from base64
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | (base64 --decode 2>/dev/null || base64 -D) > "$CERT_PATH"

          # Save original default keychain for cleanup
          ORIGINAL_DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d '"' | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Dynamically resolve signing identity (must be "Developer ID Application")
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "❌ No 'Developer ID Application' identity found — listing all identities:" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "✅ Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Cleanup certificate file
          rm -f "$CERT_PATH"

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$MACOS_NOTARIZATION_ENABLED" != 'true' ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== macOS build attempt ${attempt}/${max_attempts} ==="
            if pnpm tauri build --config "$TAURI_RELEASE_CONFIG" --target universal-apple-darwin --bundles app; then
              echo "✅ macOS build succeeded"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ macOS build failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ macOS build failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --config $env:TAURI_RELEASE_CONFIG --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri build --config $env:TAURI_RELEASE_CONFIG --bundles msi
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --config "$TAURI_RELEASE_CONFIG" --bundles appimage,deb,rpm

      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$RELEASE_TAG"

          # Locate bundle artifacts
          TAR_GZ=""; APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$TAR_GZ" ]   && TAR_GZ=$(find "$path" -maxdepth 1 -name "*.tar.gz" -type f | head -1 || true)
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found" >&2
            exit 1
          fi

          if [ "$MACOS_NOTARIZATION_ENABLED" = 'true' ]; then
            # Tauri notarized the app when Apple credentials were enabled.
            xcrun stapler staple "$APP_PATH"
            echo "✅ .app stapled"
          fi

          # Updater artifacts are required only when independent signing is enabled.
          if [ "$SIGNED_UPDATER_ENABLED" = 'true' ]; then
            if [ -z "$TAR_GZ" ] || [ ! -f "$TAR_GZ.sig" ]; then
              echo "::error::Signed macOS updater payload or signature is missing."
              exit 1
            fi
            NEW_TAR_GZ="YunSwitch-${VERSION}-macOS.tar.gz"
            cp "$TAR_GZ" "release-assets/$NEW_TAR_GZ"
            cp "$TAR_GZ.sig" "release-assets/$NEW_TAR_GZ.sig"
          fi

          # 2) Collect .app as zip
          NEW_ZIP="YunSwitch-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # 3) Create styled DMG with create-dmg (Tauri's built-in DMG styling doesn't work on CI)
          if [ "$MACOS_NOTARIZATION_ENABLED" = 'true' ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "❌ APPLE_SIGNING_IDENTITY is missing before DMG creation" >&2
            exit 1
          fi

          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="YunSwitch-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/YunSwitch.app"

          dmg_args=(
            --volname "YunSwitch"
            --background "src-tauri/icons/dmg-background.png"
            --window-size 660 400
            --window-pos 200 120
            --icon-size 80
            --icon "YunSwitch.app" 180 220
            --hide-extension "YunSwitch.app"
            --app-drop-link 480 220
            --no-internet-enable
          )
          if [ "$MACOS_NOTARIZATION_ENABLED" = 'true' ]; then
            dmg_args+=(--codesign "$APPLE_SIGNING_IDENTITY")
          fi

          create-dmg "${dmg_args[@]}" "release-assets/$NEW_DMG" "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Styled DMG created: $NEW_DMG"

      - name: Notarize macOS DMG
        if: runner.os == 'macOS' && env.MACOS_NOTARIZATION_ENABLED == 'true'
        shell: bash
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -z "$DMG_PATH" ]; then
            echo "❌ No .dmg found in release-assets/ to notarize" >&2
            exit 1
          fi

          echo "=== Notarizing DMG: $DMG_PATH ==="
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== DMG notarization attempt ${attempt}/${max_attempts} ==="
            if xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait; then
              echo "✅ DMG notarization succeeded"
              xcrun stapler staple "$DMG_PATH"
              echo "✅ DMG stapled"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ DMG notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ DMG notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Verify macOS code signing and notarization
        if: runner.os == 'macOS' && env.MACOS_NOTARIZATION_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Verify .app (from Tauri bundle)
          APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found for verification" >&2
            exit 1
          fi
          echo "=== Verifying .app: $APP_PATH ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✅ codesign verification passed"
          spctl -a -t exec -vv "$APP_PATH"
          echo "✅ spctl assessment passed"
          xcrun stapler validate "$APP_PATH"
          echo "✅ .app stapler validation passed"

          # Verify .dmg (from release-assets/, created by create-dmg + notarized)
          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -n "$DMG_PATH" ]; then
            echo "=== Verifying .dmg: $DMG_PATH ==="
            codesign --verify --verbose=2 "$DMG_PATH"
            echo "✅ .dmg codesign verification passed"
            spctl -a -t open --context context:primary-signature -vv "$DMG_PATH"
            echo "✅ .dmg spctl assessment passed"
            xcrun stapler validate "$DMG_PATH"
            echo "✅ .dmg stapler validation passed"
          else
            echo "❌ No .dmg found for verification — release would ship without verified DMG" >&2
            exit 1
          fi

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:RELEASE_TAG
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          # 仅打包 MSI 安装器 + .sig（用于 Updater）
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "YunSwitch-$VERSION-Windows$assetSuffix.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
            $sigPath = "$($msi.FullName).sig"
            if (Test-Path $sigPath) {
              Copy-Item $sigPath (Join-Path release-assets ("$dest.sig"))
              Write-Host "Signature copied: $dest.sig"
            } elseif ($env:SIGNED_UPDATER_ENABLED -eq 'true') {
              throw "Signature not found for $($msi.Name)"
            } else {
              Write-Host 'Updater signing disabled; no MSI signature is expected.'
            }
          } else {
            throw 'No Windows MSI installer found'
          }

          # 免安装版：可执行文件、许可证及数据目录说明（不参与 Updater）
          $exeCandidates = if ($isArm64) {
            @('src-tauri/target/aarch64-pc-windows-msvc/release/cc-switch.exe')
          } else {
            @(
              'src-tauri/target/release/cc-switch.exe',
              'src-tauri/target/x86_64-pc-windows-msvc/release/cc-switch.exe'
            )
          }
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/YunSwitch-Portable'
            $assetsRoot = [System.IO.Path]::GetFullPath('release-assets')
            $portableDir = [System.IO.Path]::GetFullPath($portableDir)
            if (-not $portableDir.StartsWith($assetsRoot + [System.IO.Path]::DirectorySeparatorChar, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'Portable staging directory must stay inside release-assets'
            }
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            Copy-Item -LiteralPath LICENSE -Destination (Join-Path $portableDir 'LICENSE')
            Copy-Item -LiteralPath THIRD-PARTY-NOTICES.md -Destination $portableDir
            $portableLicenses = Join-Path $portableDir 'licenses'
            New-Item -ItemType Directory -Path $portableLicenses | Out-Null
            foreach ($licenseName in @('CodexBar-MIT.txt', 'LobeHub-Icons-MIT.txt', 'AgentRouter-Responses-Shim-MIT.txt', 'Async-Compression-MIT.txt')) {
              Copy-Item -LiteralPath (Join-Path 'licenses' $licenseName) -Destination $portableLicenses
            }
            @(
              "YunSwitch $VERSION - Windows $env:WINDOWS_RELEASE_ARCH",
              'Run cc-switch.exe to start YunSwitch. No installer is required.',
              'Data: %USERPROFILE%\.yunswitch; app/window state: %APPDATA%\io.github.yunhanhai.yunswitch.',
              'portable.ini marks this package; it does not move all data beside the executable.',
              'For migration, back up the old application and import a copy. YunSwitch does not automatically import its database.',
              'CLI configurations are shared when using the same Windows user; switching a provider can update them.',
              'Automatic updates are disabled. Close YunSwitch and replace this package to upgrade manually.',
              'This prerelease is unsigned. SHA-256 checksums verify file integrity, not publisher identity.',
              'Project: https://github.com/yunhanhai/yunswitch',
              'Attribution and license terms are included in LICENSE, THIRD-PARTY-NOTICES.md and licenses/.'
            ) | Set-Content -LiteralPath (Join-Path $portableDir 'README.txt') -Encoding utf8
            $portableIniPath = Join-Path $portableDir 'portable.ini'
            $portableContent = if ($isArm64) {
              @(
                '# YunSwitch portable ARM64 build marker',
                'portable=true',
                'arch=arm64'
              )
            } else {
              @(
                '# YunSwitch portable build marker',
                'portable=true'
              )
            }
            $portableContent | Set-Content -Path $portableIniPath -Encoding UTF8
            $portableZip = "release-assets/YunSwitch-$VERSION-Windows$assetSuffix-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -LiteralPath $portableDir -Recurse -Force
            Write-Host "Windows portable zip created: YunSwitch-$VERSION-Windows$assetSuffix-Portable.zip"
          } else {
            throw 'Portable exe not found'
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$RELEASE_TAG"
          ARCH="${{ matrix.arch || 'x86_64' }}"
          # Updater artifact: AppImage（含对应 .sig）
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -n "$APPIMAGE" ]; then
            NEW_APPIMAGE="YunSwitch-${VERSION}-Linux-${ARCH}.AppImage"
            cp "$APPIMAGE" "release-assets/$NEW_APPIMAGE"
            if [ "$SIGNED_UPDATER_ENABLED" = 'true' ]; then
              if [ ! -f "$APPIMAGE.sig" ]; then
                echo "::error::Signed Linux updater signature is missing."
                exit 1
              fi
              cp "$APPIMAGE.sig" "release-assets/$NEW_APPIMAGE.sig"
            fi
            echo "AppImage copied: $NEW_APPIMAGE"
          else
            echo "::error::No AppImage found under target/release/bundle"
            exit 1
          fi
          # 额外上传 .deb（用于手动安装，不参与 Updater）
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-assets/YunSwitch-${VERSION}-Linux-${ARCH}.deb"
            echo "Deb package copied: YunSwitch-${VERSION}-Linux-${ARCH}.deb"
          else
            echo "No .deb found (optional)"
          fi
          # 额外上传 .rpm（用于 Fedora/RHEL/openSUSE 等，不参与 Updater）
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-assets/YunSwitch-${VERSION}-Linux-${ARCH}.rpm"
            echo "RPM package copied: YunSwitch-${VERSION}-Linux-${ARCH}.rpm"
          else
            echo "No .rpm found (optional)"
          fi

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Collect Signatures
        shell: bash
        run: |
          set -euo pipefail
          echo "Collected signatures (if any alongside artifacts):"
          ls -la release-assets/*.sig || echo "No signatures found"

      - name: Save built packages before installation acceptance
        uses: actions/upload-artifact@v7
        with:
          name: built-packages-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: Accept Windows x64 production packages on a clean runner
        if: runner.os == 'Windows' && matrix.arch != 'arm64'
        shell: pwsh
        timeout-minutes: 16
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $acceptanceArgs = @('--require-third-party-notices', 'true')
          $previousTag = if ($env:PREVIOUS_TAG) { $env:PREVIOUS_TAG } else { 'v3.20.1-yunswitch.7' }
          if ($previousTag -notmatch '^v\d+\.\d+\.\d+-yunswitch\.\d+$' -or $previousTag -eq "v$version") { throw 'Previous public tag must differ from the new source version' }
          if ($previousTag) {
            $previousName = "YunSwitch-$previousTag-Windows.msi"
            $previousMsi = Join-Path $env:RUNNER_TEMP $previousName
            $previousUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$previousTag/$previousName"
            Invoke-WebRequest -Uri $previousUrl -OutFile $previousMsi
            Invoke-WebRequest -Uri "$previousUrl.sha256" -OutFile "$previousMsi.sha256"
            $publishedChecksum = (Get-Content -LiteralPath "$previousMsi.sha256" -Raw).Trim()
            $previousHash = (Get-FileHash -LiteralPath $previousMsi -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($publishedChecksum -ne "$previousHash  $previousName") { throw 'Previous MSI checksum differs from its published sidecar' }
            if ($previousTag -eq 'v3.20.1-yunswitch.2' -and $previousHash -ne '2b0e1e88febe1c3f07862a381e1aefa21b90f9db547ef4995ed3aa345e951930') { throw 'Previous MSI differs from the accepted second prerelease' }
            if ($previousTag -eq 'v3.20.1-yunswitch.3' -and $previousHash -ne '3cbf7344352229d17cf978889561cc31b115677080c6b0ab78ef4b87539aceb4') { throw 'Previous MSI differs from the accepted third prerelease' }
            if ($previousTag -eq 'v3.20.1-yunswitch.4' -and $previousHash -ne 'a534673e35a98ed5f2a5877237e027c756e21c188895de78349bb5adeb1bbb3d') { throw 'Previous MSI differs from the accepted fourth prerelease' }
            if ($previousTag -eq 'v3.20.1-yunswitch.5' -and $previousHash -ne '54e1a2de96be0cd9b46d2b818dee63d6a95f4194669677d197b9ad049ec27b14') { throw 'Previous MSI differs from the accepted fifth prerelease' }
            if ($previousTag -eq 'v3.20.1-yunswitch.6' -and $previousHash -ne '5ca0febf89b882fc901fe0515bef661a1ca022f6cff6725064147212e058a2ec') { throw 'Previous MSI differs from the accepted sixth prerelease' }
            if ($previousTag -eq 'v3.20.1-yunswitch.7' -and $previousHash -ne '4e031e6fa4c9f8fd695c7d4f2dad29d86f247eb8f2aac81bb4a5652aad6a539d') { throw 'Previous MSI differs from the accepted seventh prerelease' }
            $acceptanceArgs += @('--previous-msi', $previousMsi, '--previous-version', $previousTag.Substring(1), '--previous-msi-sha256', $previousHash)
          }
          node scripts/windows-release-smoke.mjs `
            --msi "release-assets/YunSwitch-$env:RELEASE_TAG-Windows.msi" `
            --zip "release-assets/YunSwitch-$env:RELEASE_TAG-Windows-Portable.zip" `
            --output "$env:RUNNER_TEMP/yunswitch-smoke" @acceptanceArgs
          if ($LASTEXITCODE -ne 0) { throw 'Windows package acceptance failed' }

      - name: Upload Windows installation acceptance evidence
        if: always() && runner.os == 'Windows' && matrix.arch != 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-installation-evidence
          path: ${{ runner.temp }}/yunswitch-smoke/
          if-no-files-found: warn

      - name: Generate asset checksums
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const entries = readdirSync('release-assets').sort().filter(name =>
            !name.endsWith('.sig') && !name.endsWith('.sha256') && statSync(join('release-assets', name)).isFile());
          for (const name of entries) {
            const hash = createHash('sha256').update(readFileSync(join('release-assets', name))).digest('hex');
            writeFileSync(join('release-assets', `${name}.sha256`), `${hash}  ${name}\n`);
          }
          NODE

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

      - name: Clean up Apple signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi

  publish-release:
    name: Prepare draft GitHub Release
    runs-on: ubuntu-22.04
    needs: release
    if: inputs.source_ref == ''
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Require a new or existing draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${encodeURIComponent(process.env.RELEASE_TAG)}`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (response.status === 404) process.exit(0);
          if (!response.ok) throw new Error(`Release lookup failed: HTTP ${response.status}`);
          if (!(await response.json()).draft) {
            throw new Error('Refusing to overwrite an already public release; use a new prerelease version');
          }
          NODE

      - name: Upload draft Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: YunSwitch ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: true
          make_latest: false
          body: |
            ## YunSwitch ${{ env.RELEASE_TAG }}

            **Independently maintained by yunhanhai / yunhanhai 独立维护版**: [Gitee](https://gitee.com/yunhanhai/yunswitch) · [GitHub](https://github.com/yunhanhai/yunswitch)

            AI 编程工具配置与路由管理。基于 MIT 开源项目 [CC Switch](https://github.com/farion1231/cc-switch) 持续独立开发。

            此版本为待验收的独立预发布草稿；验收通过后由维护者公开。应用内自动更新默认关闭。

            本次构建范围：`${{ env.RELEASE_SCOPE }}`。默认只构建 Windows x64；其他平台仅在明确选择 `all` 时构建，每个平台仍需独立安装验收。

            ### 下载

            - **Windows (x86_64)**: `YunSwitch-${{ env.RELEASE_TAG }}-Windows.msi`（安装版）或 `YunSwitch-${{ env.RELEASE_TAG }}-Windows-Portable.zip`（绿色版）
            - **选择 all 时的 macOS**: `YunSwitch-${{ env.RELEASE_TAG }}-macOS.dmg` 或 `YunSwitch-${{ env.RELEASE_TAG }}-macOS.zip`
            - **选择 all 时的 Windows (ARM64)**: `YunSwitch-${{ env.RELEASE_TAG }}-Windows-arm64.msi`（安装版）或 `YunSwitch-${{ env.RELEASE_TAG }}-Windows-arm64-Portable.zip`（绿色版）
            - **选择 all 时的 Linux (x86_64)**: `YunSwitch-${{ env.RELEASE_TAG }}-Linux-x86_64.AppImage` / `.deb` / `.rpm`
            - **选择 all 时的 Linux (ARM64)**: `YunSwitch-${{ env.RELEASE_TAG }}-Linux-arm64.AppImage` / `.deb` / `.rpm`

            > `.tar.gz`、`.sig` 和 `latest.json` 仅在启用 YunSwitch 自有 updater 签名时生成，无需手动下载。
            > 每个安装包另附 `.sha256` 文件，可用于校验下载文件完整性；它不代表发布者签名。

            ---
            - Updater 签名启用：`${{ env.SIGNED_UPDATER_ENABLED }}`。
            - Apple Developer ID 签名与公证启用：`${{ env.MACOS_NOTARIZATION_ENABLED }}`。关闭时 macOS 应用仅使用 ad hoc 签名，未经 Apple 公证，系统可能要求手动允许打开。
            - Windows 安装包和可执行文件未配置 Authenticode 签名，系统可能显示未知发布者。
            - 请以本次构建记录与实际安装包验证结果为准。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-22.04
    needs: publish-release
    if: vars.YUNSWITCH_SIGNED_UPDATER_ENABLED == 'true'
    permissions:
      contents: write
    steps:
      - name: Prepare GH
        run: |
          gh --version || (type -p curl >/dev/null && sudo apt-get update && sudo apt-get install -y gh || true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="$RELEASE_TAG"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl || true
      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, existsSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const tag = process.env.TAG;
          const baseUrl = `https://github.com/${process.env.REPO}/releases/download/${tag}`;
          const rules = [
            ['-macOS.tar.gz', ['darwin-aarch64', 'darwin-x86_64']],
            ['-Windows-arm64.msi', ['windows-aarch64']],
            ['-Windows.msi', ['windows-x86_64']],
            ['-Linux-arm64.AppImage', ['linux-aarch64']],
            ['-Linux-x86_64.AppImage', ['linux-x86_64']],
          ];
          const platforms = {};
          for (const sig of readdirSync('dl').filter(name => name.endsWith('.sig'))) {
            const name = sig.slice(0, -4);
            const rule = rules.find(([suffix]) => name.endsWith(suffix));
            if (!rule) continue;
            if (!existsSync(join('dl', name))) throw new Error(`Updater payload missing: ${name}`);
            const signature = readFileSync(join('dl', sig), 'utf8').trim();
            if (!signature) throw new Error(`Updater signature empty: ${sig}`);
            for (const key of rule[1]) {
              if (platforms[key]) throw new Error(`Duplicate updater target: ${key}`);
              platforms[key] = { signature, url: `${baseUrl}/${encodeURIComponent(name)}` };
            }
          }
          if (Object.keys(platforms).length !== 6) {
            throw new Error('Signed release requires updater payloads for all six platform targets');
          }
          writeFileSync('latest.json', JSON.stringify({
            version: tag.replace(/^v/, ''), notes: `YunSwitch prerelease ${tag}`,
            pub_date: new Date().toISOString(), platforms,
          }, null, 2) + '\n');
          NODE
      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          gh release upload "$RELEASE_TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
