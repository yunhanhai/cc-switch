name: YunSwitch Windows package recheck

on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      package_source_sha:
        required: true
        type: string
      source_ref:
        required: false
        type: string
      previous_tag:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Same-repository run containing built-packages-Windows-X64"
        required: true
        type: string
      package_source_sha:
        description: "Exact source SHA used to build those packages"
        required: true
        type: string
      source_ref:
        description: "Ref containing the acceptance script; leave empty to use the dispatch ref"
        required: false
        type: string
      previous_tag:
        description: "Previous public YunSwitch tag for MSI upgrade acceptance"
        required: false
        type: string
        default: v3.20.1-yunswitch.5

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-package-recheck-${{ inputs.build_run_id }}
  cancel-in-progress: true

jobs:
  recheck:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Validate package provenance and unchanged product sources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          PACKAGE_SOURCE_SHA: ${{ inputs.package_source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'Use a numeric build run ID' }
          if ($env:PACKAGE_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Use a full source SHA' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the package build run' }
          if ($run.repository.full_name -ne $env:GITHUB_REPOSITORY) { throw 'Build belongs to another repository' }
          if ($run.head_sha -ne $env:PACKAGE_SOURCE_SHA) { throw 'Package source SHA does not match build run' }
          if ($run.status -ne 'completed') { throw 'Wait for the package build run to finish' }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read package artifacts' }
          $packages = @($artifacts.artifacts | Where-Object { $_.name -eq 'built-packages-Windows-X64' -and -not $_.expired })
          if ($packages.Count -ne 1) { throw 'Expected one unexpired Windows x64 package artifact' }
          git cat-file -e "$env:PACKAGE_SOURCE_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Package source commit is unavailable' }
          git diff --exit-code $env:PACKAGE_SOURCE_SHA HEAD -- src src-tauri package.json pnpm-lock.yaml index.html LICENSE THIRD-PARTY-NOTICES.md licenses
          if ($LASTEXITCODE -ne 0) { throw 'Product or bundled license sources differ from those used to build the packages' }
          $provenance = @{
            packageBuildRun = $env:BUILD_RUN_ID
            packageSourceSha = $env:PACKAGE_SOURCE_SHA
            acceptanceSourceSha = (git rev-parse HEAD)
            packageArtifactId = $packages[0].id
            productSourcesUnchanged = $true
          }
          $provenance | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/package-provenance.json" -Encoding utf8

      - name: Download the existing Windows x64 packages
        uses: actions/download-artifact@v8
        with:
          name: built-packages-Windows-X64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Accept the unchanged Windows x64 packages
        shell: pwsh
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+-yunswitch\.\d+$') { throw 'Use an independent YunSwitch source version' }
          if (-not $env:PREVIOUS_TAG -and $version -ne '3.20.1-yunswitch.1') {
            $previousNumber = [int]($version.Split('.')[-1]) - 1
            $env:PREVIOUS_TAG = 'v' + ($version -replace '\d+$', $previousNumber.ToString())
          }
          $smokeArgs = @(
            'scripts/windows-release-smoke.mjs',
            '--msi', "release-assets/YunSwitch-v$version-Windows.msi",
            '--zip', "release-assets/YunSwitch-v$version-Windows-Portable.zip",
            '--output', "$env:RUNNER_TEMP/yunswitch-smoke"
          )
          if (Test-Path -LiteralPath THIRD-PARTY-NOTICES.md) {
            $smokeArgs += @('--require-third-party-notices', 'true')
          }
          if ($env:PREVIOUS_TAG) {
            if ($env:PREVIOUS_TAG -notmatch '^v\d+\.\d+\.\d+-yunswitch\.\d+$') { throw 'Use an independent previous YunSwitch tag' }
            if ($env:PREVIOUS_TAG -eq "v$version") { throw 'Previous release must differ from the packages under acceptance' }
            $previousRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:PREVIOUS_TAG" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $previousRelease.draft) { throw 'Previous release must be public' }
            $previousDir = Join-Path $env:RUNNER_TEMP 'yunswitch-previous-release'
            New-Item -ItemType Directory -Path $previousDir | Out-Null
            $previousName = "YunSwitch-$env:PREVIOUS_TAG-Windows.msi"
            gh release download $env:PREVIOUS_TAG --repo $env:GITHUB_REPOSITORY --pattern $previousName --pattern "$previousName.sha256" --dir $previousDir
            if ($LASTEXITCODE -ne 0) { throw 'Previous published MSI download failed' }
            $previousPath = Join-Path $previousDir $previousName
            $checksum = (Get-Content -LiteralPath "$previousPath.sha256" -Raw).Trim()
            $previousHash = (Get-FileHash -LiteralPath $previousPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($checksum -ne "$previousHash  $previousName") { throw 'Previous MSI checksum does not match its published sidecar' }
            if ($env:PREVIOUS_TAG -eq 'v3.20.1-yunswitch.1' -and $previousHash -ne 'faccd91fc892a4b060ece561b5e908f7e8c8db9f7aeab7a3741864f15ee0480b') { throw 'First prerelease MSI differs from the recorded accepted package' }
            if ($env:PREVIOUS_TAG -eq 'v3.20.1-yunswitch.2' -and $previousHash -ne '2b0e1e88febe1c3f07862a381e1aefa21b90f9db547ef4995ed3aa345e951930') { throw 'Second prerelease MSI differs from the recorded accepted package' }
            if ($env:PREVIOUS_TAG -eq 'v3.20.1-yunswitch.3' -and $previousHash -ne '3cbf7344352229d17cf978889561cc31b115677080c6b0ab78ef4b87539aceb4') { throw 'Third prerelease MSI differs from the recorded accepted package' }
            if ($env:PREVIOUS_TAG -eq 'v3.20.1-yunswitch.4' -and $previousHash -ne 'a534673e35a98ed5f2a5877237e027c756e21c188895de78349bb5adeb1bbb3d') { throw 'Fourth prerelease MSI differs from the recorded accepted package' }
            if ($env:PREVIOUS_TAG -eq 'v3.20.1-yunswitch.5' -and $previousHash -ne '54e1a2de96be0cd9b46d2b818dee63d6a95f4194669677d197b9ad049ec27b14') { throw 'Fifth prerelease MSI differs from the recorded accepted package' }
            $smokeArgs += @('--previous-msi', $previousPath, '--previous-msi-sha256', $previousHash, '--previous-version', $env:PREVIOUS_TAG.Substring(1))
          }
          node @smokeArgs
          if ($LASTEXITCODE -ne 0) { throw 'Windows package acceptance failed' }

      - name: Preserve package provenance with acceptance evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = "$env:RUNNER_TEMP/yunswitch-smoke"
          $provenance = "$env:RUNNER_TEMP/package-provenance.json"
          if ((Test-Path -LiteralPath $evidence) -and (Test-Path -LiteralPath $provenance)) {
            Copy-Item -LiteralPath $provenance -Destination $evidence
          }

      - name: Upload installation acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-installation-evidence
          path: ${{ runner.temp }}/yunswitch-smoke/
          if-no-files-found: warn

      - name: Generate checksums for the accepted packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | Where-Object { $_.Name -notmatch '\.(sig|sha256)$' })
          if ($assets.Count -ne 2) { throw 'Expected the MSI and portable ZIP only' }
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)" | Set-Content -LiteralPath "$($asset.FullName).sha256" -Encoding utf8NoBOM
          }

      - name: Upload the accepted release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-Windows-X64
          path: release-assets/*
          if-no-files-found: error
